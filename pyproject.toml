[project]
name = "transcript-to-podcast"
version = "0.1.0"
description = "Turn a two-host markdown transcript into a two-voice MP3 podcast (edge-tts + ffmpeg)"
readme = "README.md"
authors = [
    { name = "Miroslav Simko", email = "ms@iolabs.ch" }
]
requires-python = ">=3.10"
dependencies = [
    "edge-tts>=7.2.8",
]

[project.scripts]
transcript-to-podcast = "transcript_to_podcast:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"
